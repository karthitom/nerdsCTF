version: '3.8'

services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: nerdctf-backend
    restart: always
    environment:
      - PORT=5000
      - JWT_ACCESS_SECRET=access_token_super_secret_key_12345
      - JWT_REFRESH_SECRET=refresh_token_super_secret_key_67890
      - FRONTEND_URL=http://localhost:3000
      - COOKIE_DOMAIN=localhost
      - NODE_ENV=production
      - FIREBASE_PROJECT_ID=${FIREBASE_PROJECT_ID}
      - FIREBASE_CLIENT_EMAIL=${FIREBASE_CLIENT_EMAIL}
      - FIREBASE_PRIVATE_KEY=${FIREBASE_PRIVATE_KEY}
    ports:
      - "5000:5000"
    networks:
      - nerdctf-network

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: nerdctf-frontend
    restart: always
    environment:
      - NEXT_PUBLIC_API_URL=http://localhost:5000/api/v1
    ports:
      - "3000:3000"
    depends_on:
      - backend
    networks:
      - nerdctf-network

  # Labs
  lab1-cookie-monster:
    build:
      context: ./labs/lab1-cookie-monster
      dockerfile: Dockerfile
    container_name: lab1-cookie-monster
    restart: always
    ports:
      - "8001:80"
    networks:
      - nerdctf-network

  lab2-source-detective:
    build:
      context: ./labs/lab2-source-detective
      dockerfile: Dockerfile
    container_name: lab2-source-detective
    restart: always
    ports:
      - "8002:80"
    networks:
      - nerdctf-network

  lab3-hidden-header:
    build:
      context: ./labs/lab3-hidden-header
      dockerfile: Dockerfile
    container_name: lab3-hidden-header
    restart: always
    ports:
      - "8003:80"
    networks:
      - nerdctf-network

  lab4-encoded-secrets:
    build:
      context: ./labs/lab4-encoded-secrets
      dockerfile: Dockerfile
    container_name: lab4-encoded-secrets
    restart: always
    ports:
      - "8004:80"
    networks:
      - nerdctf-network

  lab5-broken-api:
    build:
      context: ./labs/lab5-broken-api
      dockerfile: Dockerfile
    container_name: lab5-broken-api
    restart: always
    ports:
      - "8005:80"
    networks:
      - nerdctf-network

networks:
  nerdctf-network:
    driver: bridge
