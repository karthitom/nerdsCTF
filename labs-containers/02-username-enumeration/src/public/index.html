<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Forgot Password</title>
    <style>
        body { font-family: sans-serif; background-color: #f4f4f9; display: flex; justify-content: center; align-items: center; height: 100vh; margin: 0; }
        .card { background: white; padding: 40px; border-radius: 8px; box-shadow: 0 4px 6px rgba(0,0,0,0.1); width: 100%; max-width: 350px; }
        h2 { margin-top: 0; color: #333; }
        p { color: #666; font-size: 14px; margin-bottom: 20px; }
        input { width: 100%; padding: 10px; margin-bottom: 15px; border: 1px solid #ddd; border-radius: 4px; box-sizing: border-box; }
        button { width: 100%; padding: 10px; background: #007bff; color: white; border: none; border-radius: 4px; cursor: pointer; font-weight: bold; }
        button:hover { background: #0056b3; }
        #response { margin-top: 15px; font-size: 14px; text-align: center; }
        .error { color: #dc3545; }
        .success { color: #28a745; }
    </style>
</head>
<body>

<div class="card">
    <h2>Reset Password</h2>
    <p>Enter your username to receive a password reset link via email.</p>
    <input type="text" id="username" placeholder="Username">
    <button id="resetBtn">Send Reset Link</button>
    <div id="response"></div>
</div>

<script>
    document.getElementById('resetBtn').addEventListener('click', async () => {
        const username = document.getElementById('username').value;
        const respDiv = document.getElementById('response');
        respDiv.className = '';
        respDiv.textContent = 'Checking...';

        try {
            const res = await fetch('/api/forgot-password', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ username })
            });

            const data = await res.json();

            if (res.ok) {
                respDiv.className = 'success';
                respDiv.textContent = data.message;
            } else {
                respDiv.className = 'error';
                respDiv.textContent = data.error;
            }
        } catch (err) {
            respDiv.className = 'error';
            respDiv.textContent = 'Network error';
        }
    });
</script>
</body>
</html>
