<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>User Profile</title>
    <style>
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background-color: #2c3e50; color: #ecf0f1; margin: 0; padding: 20px; }
        .container { max-width: 600px; margin: 0 auto; background-color: #34495e; padding: 20px; border-radius: 8px; box-shadow: 0 4px 15px rgba(0,0,0,0.3); }
        h1 { border-bottom: 2px solid #e74c3c; padding-bottom: 10px; }
        .profile-card { background: #2c3e50; padding: 15px; border-radius: 5px; margin-top: 20px; border-left: 4px solid #3498db; }
        .btn { padding: 10px 15px; background: #27ae60; color: white; border: none; border-radius: 4px; cursor: pointer; font-weight: bold; }
        .btn:hover { background: #2ecc71; }
        .secret-box { margin-top: 15px; padding: 10px; background: #e74c3c; color: white; border-radius: 4px; font-family: monospace; word-break: break-all; }
        #appContent { display: none; }
    </style>
</head>
<body>

<div class="container" id="loginScreen">
    <h1>Welcome to the Portal</h1>
    <p>Please log in to view your profile.</p>
    <button class="btn" id="loginBtn">Login as Guest</button>
</div>

<div class="container" id="appContent">
    <h1>My Profile</h1>
    <p>Current logged in user ID: <span id="currentId"></span></p>
    
    <div class="profile-card" id="profileData">
        Loading...
    </div>
</div>

<script>
    let myUserId = null;

    document.getElementById('loginBtn').addEventListener('click', async () => {
        const res = await fetch('/api/login', { method: 'POST' });
        const data = await res.json();
        
        if (data.success) {
            myUserId = data.userId;
            document.getElementById('loginScreen').style.display = 'none';
            document.getElementById('appContent').style.display = 'block';
            document.getElementById('currentId').textContent = myUserId;
            
            // Automatically fetch profile
            fetchProfile(myUserId);
        }
    });

    async function fetchProfile(id) {
        const profileDiv = document.getElementById('profileData');
        profileDiv.innerHTML = 'Loading...';
        
        try {
            const res = await fetch(`/api/users/${id}`);
            const data = await res.json();
            
            if (res.ok) {
                profileDiv.innerHTML = `
                    <p><strong>Name:</strong> ${data.name}</p>
                    <p><strong>Role:</strong> ${data.role}</p>
                    <div class="secret-box"><strong>Secret:</strong> ${data.secret}</div>
                `;
            } else {
                profileDiv.innerHTML = `<p style="color: #e74c3c">Error: ${data.error}</p>`;
            }
        } catch (err) {
            profileDiv.innerHTML = `<p style="color: #e74c3c">Connection Error</p>`;
        }
    }
</script>
</body>
</html>
